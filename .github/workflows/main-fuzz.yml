name: Main Branch Fuzz Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: main-fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.14.1

jobs:
  fuzz:
    name: zig build test --fuzz
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          cache-key: ubuntu-latest-${{ env.ZIG_VERSION }}

      - name: Run fuzz tests
        run: zig build test --fuzz
